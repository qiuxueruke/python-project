services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: MyStrongP@ss123
      MYSQL_DATABASE: fastapi_app
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass MyRedisP@ss123 --appendonly yes

  api:
    build: .
    image: fastapi-app:latest
    container_name: fastapi
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://root:MyStrongP%40ss123@mysql:3306/fastapi_app
      REDIS_URL: redis://:MyRedisP%40ss123@redis:6379/0
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/logs:/var/log/nginx

volumes:
  mysql_data:
  redis_data:
