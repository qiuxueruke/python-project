[project]
name = "fastapi-app"
version = "0.1.0"
description = "A FastAPI application"
readme = "README.md"
authors = [
    { name = "zcy", email = "18256985885@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
